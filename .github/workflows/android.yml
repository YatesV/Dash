name: Build and Release Dash APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dash-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dash-android-debug-keystore-v1

      - name: Ensure stable Android signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dash Debug,O=YatesV,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch and convert original Pixelite font
        run: |
          python -m pip install --quiet fonttools brotli
          curl -fsSL https://raw.githubusercontent.com/YatesV/yatesv.github.io/main/fonts/Pixelite.woff2 -o /tmp/Pixelite.woff2
          mkdir -p app/src/main/res/font
          python - <<'PY'
          from fontTools.ttLib import TTFont
          font = TTFont("/tmp/Pixelite.woff2")
          font.flavor = None
          font.save("app/src/main/res/font/pixelite.ttf")
          PY

      - name: Set app version from release number
        run: sed -i 's/versionCode = 1; versionName = "1.0.0"/versionCode = ${{ github.run_number }}; versionName = "1.0.${{ github.run_number }}"/' app/build.gradle.kts

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Dash.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dash-debug-apk
          path: Dash.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dash v1.0.${{ github.run_number }}
          body: |
            ## Dash Android APK

            Download **Dash.apk** below and install it on your Android device.

            This is an automatically generated build from the latest commit on main.
          files: Dash.apk
          generate_release_notes: true
          make_latest: true
